program: scripts/skrl/train_sequential.py
command:
  - /workspace/isaaclab/_isaac_sim/python.sh
  - ${program}
  - --task=Template-Quadcopter-Vel-Control-Direct-v0
  - --headless
method: bayes
metric:
  goal: maximize
  name: Info/Episode_Reward/total_reward

parameters:
  # Learning parameters
  learning_rate:
    distribution: log_uniform_values
    min: 0.00001
    max: 0.001
  
  learning_epochs:
    values: [5, 8, 10]
  
  rollouts:
    values: [32, 64, 128]
  
  # PPO specific
  discount_factor:
    values: [0.97, 0.99]
  
  entropy_loss_scale:
    distribution: uniform
    min: 0.0
    max: 0.05

  # Reward scales
  vel_error_scale:
    distribution: uniform
    min: 0.1
    max: 50.0

  omega_error_scale:
    distribution: uniform
    min: 0.1
    max: 50.0 
  
  # upright_reward_scale:
  #   distribution: uniform
  #   min: -10.0
  #   max: -0.1
  
  diff_action_scale:
    distribution: uniform
    min: -5.0
    max: -0.01

  rollover_scale:
    distribution: uniform
    min: -5.0
    max: -0.01

  life_scale:
    distribution: uniform
    min: 0.01
    max: 5.0

