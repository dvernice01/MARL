# config.yaml
program: training_offline_sweep.py
method: random
name: sweep
metric:
  goal: minimize 
  name: val_to_minimize

parameters:
  latent_dim:
    values: [128, 256, 512]
  num_conv_layers:
    values: [ 3, 4, 5, 6]  
  use_residual:
    values: [true, false]
  # decoder_num_dense:
  #   values: [1, 2, 3]
  beta_max:
    values: [5.0, 10.0, 20.0]
  num_deconv_layers:
    values: [5]
  residual_every:
    values: [2]

