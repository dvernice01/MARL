# config.yaml
program: training_offline_sweep.py
method: random
name: sweep
metric:
  goal: minimize 
  name: val_to_minimize

parameters:
  latent_dim:
    values: [128, 256, 512]
  num_conv_layers:
    values: [ 3, 4, 5, 6]  
  use_residual:
    values: [true, false]
  use_skip:
    values: [true, false]
  # decoder_num_dense:
  #   values: [1, 2, 3]
  beta_max:
    values: [40, 100, 300, 500, 1000, 2000, 5000, 10000]
  num_deconv_layers:
    values: [5]
  residual_every:
    values: [2]

