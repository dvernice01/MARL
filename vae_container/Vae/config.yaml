# config.yaml
program: training_offline_sweep.py
method: random
name: sweep
metric:
  goal: minimize 
  name: val_to_minimize

parameters:
  latent_dim:
    values: [256, 512]
  num_conv_layers:
    values: [5, 6]  
  use_residual:
    values: [True]
  use_skip:
    values: [True]
  beta_max:
    values: [500, 1000, 2000, 5000, 10000]
  num_deconv_layers:
    values: [7]
  residual_every:
    values: [2]
  lr:
    values: [1e-4]

